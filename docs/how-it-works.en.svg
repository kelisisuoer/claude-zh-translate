<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="How it works: your Chinese is translated and only the English is sent to Claude; Claude's English replies are shown in Chinese">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .lane { font-size: 15px; font-weight: 600; fill: #57606a; }
    .box { font-size: 16px; font-weight: 600; }
    .sub { font-size: 13px; fill: #57606a; }
    .note { font-size: 14px; fill: #57606a; }
  </style>
  <rect x="1" y="1" width="958" height="378" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- Sending -->
  <text x="30" y="84" class="lane">Send</text>
  <rect x="100" y="48" width="220" height="64" rx="10" fill="#fff4ec" stroke="#d97757"/>
  <text x="210" y="78" text-anchor="middle" class="box">You type Chinese</text>
  <text x="210" y="99" text-anchor="middle" class="sub">Your row still shows it</text>
  <line x1="320" y1="80" x2="380" y2="80" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="384" y="48" width="220" height="64" rx="10" fill="#eef6ff" stroke="#3b82f6"/>
  <text x="494" y="78" text-anchor="middle" class="box">Translation model</text>
  <text x="494" y="99" text-anchor="middle" class="sub">Sonnet 5.5 by default</text>
  <line x1="604" y1="80" x2="664" y2="80" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="668" y="48" width="252" height="64" rx="10" fill="#f0fdf4" stroke="#22a06b"/>
  <text x="794" y="78" text-anchor="middle" class="box">Claude gets English only</text>
  <text x="794" y="99" text-anchor="middle" class="sub">Code, logs and paths kept as-is</text>

  <!-- Claude works -->
  <line x1="794" y1="112" x2="794" y2="176" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="782" y="150" text-anchor="end" class="sub">Claude thinks, uses tools, replies in English</text>

  <!-- Replies -->
  <text x="30" y="216" class="lane">Reply</text>
  <rect x="668" y="180" width="252" height="64" rx="10" fill="#f0fdf4" stroke="#22a06b"/>
  <text x="794" y="210" text-anchor="middle" class="box">A reply block finishes</text>
  <text x="794" y="231" text-anchor="middle" class="sub">Shown in English at first</text>
  <line x1="668" y1="212" x2="608" y2="212" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="384" y="180" width="220" height="64" rx="10" fill="#eef6ff" stroke="#3b82f6"/>
  <text x="494" y="210" text-anchor="middle" class="box">Translation model</text>
  <text x="494" y="231" text-anchor="middle" class="sub">Reuses your wording + glossary</text>
  <line x1="384" y1="212" x2="324" y2="212" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100" y="180" width="220" height="64" rx="10" fill="#fff4ec" stroke="#d97757"/>
  <text x="210" y="210" text-anchor="middle" class="box">Becomes Chinese in place</text>
  <text x="210" y="231" text-anchor="middle" class="sub">or Chinese below English</text>

  <line x1="30" y1="282" x2="930" y2="282" stroke="#d0d7de"/>
  <text x="30" y="314" class="note">· Only the screen changes; the saved conversation stays in English  · Code, tables, paths and commands are kept as-is</text>
  <text x="30" y="342" class="note">· English messages pass through untouched  · /zh final translates only the last reply of each turn  · Uses your own Claude login</text>
</svg>
